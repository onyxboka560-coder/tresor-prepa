<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupe d'Étude Trésor - Adhésion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f8; color: #1a202c; padding-bottom: 2rem; }

        header { background: #0b2b68; color: #ffffff; padding: 1.5rem 1rem; text-align: center; }
        .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.75rem; display: block; }
        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.85rem; opacity: 0.9; margin-top: 0.2rem; }

        .container { max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #ffffff; padding: 1.2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .form-title { font-size: 1.2rem; font-weight: 800; color: #28a745; margin-bottom: 1rem; text-align: center; }
        
        iframe { width: 100%; height: 650px; border: none; border-radius: 8px; }
        
        .btn-mensualite {
            display: inline-block;
            background-color: #0b2b68;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <img src="IMG_20260819_155745_526.jpg" alt="Logo" class="logo">
        <h1>Groupe d'Étude Trésor</h1>
        <p class="subtitle">Fiche d'Adhésion Officielle</p>
    </header>

    <main class="container">
        <div class="card" id="content-block">
            <h2 class="form-title">Formulaire d'Adhésion</h2>
            <iframe id="adhesion-form" src="https://docs.google.com/forms/d/e/1FAIpQLSf6wVdDEXydJ4MRpVrnztgq_GWtTf4b2p4Acoomb2jWE0I6_g/viewform?embedded=true">Chargement...</iframe>
        </div>
    </main>

    <script>
        // 1. Vérification si l'adhésion a déjà été effectuée sur cet appareil
        if (localStorage.getItem('tresor_adhesion_validee') === 'true') {
            const container = document.getElementById('content-block');
            container.innerHTML = `
                <div style="text-align: center; padding: 15px 5px;">
                    <h2 style="color: #0b2b68; margin-bottom: 12px; font-size: 1.3rem;">Adhésion déjà enregistrée !</h2>
                    <p style="color: #4a5568; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.4;">
                        Vous avez déjà soumis votre fiche d'adhésion au Groupe d'Étude Trésor. 
                        Pour effectuer vos versements mensuels, rendez-vous sur la page des mensualités.
                    </p>
                    <a href="mensualite.html" class="btn-mensualite">
                        Payer ma mensualité
                    </a>
                </div>
            `;
        }

        // 2. Marquer l'adhésion comme effectuée lors de l'interaction avec le formulaire
        window.addEventListener('blur', function() {
            if (document.activeElement === document.getElementById('adhesion-form')) {
                localStorage.setItem('tresor_adhesion_validee', 'true');
            }
        });
    </script>

</body>
</html>
