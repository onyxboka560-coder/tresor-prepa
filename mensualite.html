<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Groupe d'Étude Trésor - Paiement Mensualité</title>
    <style>

        .form-title { font-size: 1.2rem; font-weight: 800; color: #0b2b68; margin-bottom: 1rem; text-align: center; }

    <header>

    <main class="container">

            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdCKYGRD299VITIZMgd2EdC2ElwbKAmWrEUgfQWzVSlfNsObA/viewform?embedded=true">Chargement...</iframe>
        </div>
    </main>

</body>
