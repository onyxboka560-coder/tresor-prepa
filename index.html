<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupe d'Étape Trésor - Accueil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f8; color: #1a202c; padding-bottom: 2rem; }

        header { background: #0b2b68; color: #ffffff; padding: 1.5rem 1rem; text-align: center; }
        .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.75rem; display: block; }
        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.85rem; opacity: 0.9; margin-top: 0.2rem; }

        .container { max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #ffffff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        
        .main-title { font-size: 1.2rem; font-weight: 800; color: #0b2b68; margin-bottom: 1rem; }
        .desc { font-size: 0.9rem; color: #4a5568; margin-bottom: 1.5rem; line-height: 1.4; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; padding: 14px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 1rem; color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-adhesion { background-color: #28a745; }
        .btn-mensualite { background-color: #0b2b68; }
    </style>
</head>
<body>

    <header>
        <img src="IMG_20260819_155745_526.jpg" alt="Logo" class="logo">
        <h1>Groupe d'Étude Trésor</h1>
        <p class="subtitle">Préparation diplôme d'État INFAS</p>
    </header>

    <main class="container">
        <div class="card">
            <h2 class="main-title">Bienvenue sur la plateforme</h2>
            <p class="desc">Sélectionnez l'option souhaitée pour effectuer votre paiement et finaliser votre inscription.</p>
            
            <div class="btn-group">
                <a href="adhesion.html" class="btn btn-adhesion">Accéder à la page Adhésion</a>
                <a href="mensualite.html" class="btn btn-mensualite">Accéder aux Mensualités</a>
            </div>
        </div>
    </main>

</body>
</html>
